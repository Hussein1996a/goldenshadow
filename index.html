<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#05070b">
<meta name="description" content="Golden Shadow — cinematic open-world action game">
<meta name="color-scheme" content="dark">
<title>الظل الذهبي — Golden Shadow</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="game-root">
    <div id="renderer-container"></div>

    <!-- ============ HUD ============ -->
    <div id="hud" class="hidden">
      <div id="hud-top">
        <div id="mission-box">
          <div id="mission-title">—</div>
          <div id="mission-desc">—</div>
          <div id="objective-list"></div>
        </div>
        <div id="hud-right">
          <div id="wanted-stars"></div>
          <div id="time-display"></div>
          <div id="location-display"></div>
        </div>
      </div>

      <div id="minimap-wrap">
        <canvas id="minimap" width="220" height="220"></canvas>
        <div id="compass"></div>
      </div>

      <div id="hud-bottom">
        <div id="weapon-box">
          <div id="weapon-name">—</div>
          <div id="ammo-display">—</div>
        </div>
        <div id="bars">
          <div class="bar-row"><span class="bar-label">HP</span><div class="bar-track"><div id="health-bar" class="bar-fill"></div></div></div>
          <div class="bar-row"><span class="bar-label">DRC</span><div class="bar-track"><div id="armor-bar" class="bar-fill"></div></div></div>
          <div class="bar-row"><span class="bar-label">$</span><div class="bar-track bar-money"><div id="money-bar" class="bar-fill"></div></div></div>
        </div>
      </div>

      <div id="crosshair" class="hidden">+</div>
      <div id="nav-marker" class="hidden">
        <div id="nav-arrow">▲</div>
        <div id="nav-distance">—</div>
      </div>
      <div id="center-msg"></div>
      <div id="subtitle"></div>
      <div id="notifications"></div>
      <div id="context-hint"></div>
      <div id="vehicle-hud" class="hidden">
        <div id="speed-display">0</div>
        <div id="speed-unit">km/h</div>
        <div id="vehicle-name">—</div>
      </div>
      <div id="cutscene" class="hidden">
        <div id="cutscene-title"></div>
        <div id="cutscene-text"></div>
      </div>
      <div id="loading-screen">
        <div class="loading-title">الظل الذهبي</div>
        <div class="loading-sub">GOLDEN SHADOW</div>
        <div class="spinner"></div>
        <div id="loading-text">جارٍ التحميل...</div>
      </div>
    </div>

    <!-- ============ TOUCH CONTROLS (mobile) ============ -->
    <div id="touch-controls" class="hidden">
      <div id="touch-look-zone"></div>
      <div id="touch-joystick">
        <div id="joystick-base"><div id="joystick-knob"></div></div>
      </div>
      <button id="tbtn-pause" class="touch-btn touch-btn-sm" type="button">☰</button>
      <!-- Action cluster: stacked rows, right-aligned, growing from small
           utility buttons at the top down to the large primary fire button
           in the bottom corner -- thumb-reachable, no overlap, no clutter. -->
      <div id="touch-buttons">
        <div class="tc-row tc-row-top">
          <button id="tbtn-weapon" class="touch-btn touch-btn-sm" type="button">⟳</button>
          <button id="tbtn-reload" class="touch-btn touch-btn-sm" type="button">R</button>
        </div>
        <div class="tc-row tc-row-mid">
          <button id="tbtn-interact" class="touch-btn touch-btn-md" type="button">E</button>
          <button id="tbtn-jump" class="touch-btn touch-btn-md" type="button">⤴</button>
        </div>
        <div class="tc-row tc-row-bottom">
          <button id="tbtn-aim" class="touch-btn touch-btn-lg touch-btn-aim" type="button">◎</button>
          <button id="tbtn-fire" class="touch-btn touch-btn-xl touch-btn-fire" type="button">●</button>
        </div>
      </div>
    </div>

    <!-- ============ MENUS ============ -->
    <div id="main-menu" dir="rtl">
      <div class="menu-bg"></div>
      <div class="menu-panel">
        <div class="logo-title">الظل الذهبي</div>
        <div class="logo-sub">GOLDEN SHADOW</div>
        <div class="logo-tagline" id="tagline">مترجم</div>
        <div class="menu-buttons">
          <button class="menu-btn primary" id="btn-continue" data-i18n="continue">متابعة اللعبة</button>
          <button class="menu-btn" id="btn-newgame" data-i18n="newgame">لعبة جديدة</button>
          <button class="menu-btn" id="btn-missions" data-i18n="missions">المهام (200+)</button>
          <button class="menu-btn" id="btn-settings" data-i18n="settings">الإعدادات</button>
          <button class="menu-btn" id="btn-controls" data-i18n="controls">التعليمات والتحكم</button>
          <button class="menu-btn" id="btn-lang" data-i18n="language">اللغة: العربية</button>
        </div>
        <div class="menu-footer" id="menu-footer-stats"></div>
      </div>
    </div>

    <div id="pause-menu" class="hidden" dir="rtl">
      <div class="menu-panel small">
        <div class="pause-title" data-i18n="pause">إيقاف مؤقت</div>
        <button class="menu-btn primary" id="btn-resume" data-i18n="resume">استئناف</button>
        <button class="menu-btn" id="btn-pause-missions" data-i18n="missions">المهام (200+)</button>
        <button class="menu-btn" id="btn-pause-settings" data-i18n="settings">الإعدادات</button>
        <button class="menu-btn" id="btn-save" data-i18n="save">حفظ اللعبة</button>
        <button class="menu-btn danger" id="btn-quit" data-i18n="quit">العودة للقائمة الرئيسية</button>
      </div>
    </div>

    <div id="missions-menu" class="hidden" dir="rtl">
      <div class="submenu-panel">
        <div class="submenu-header">
          <h2 data-i18n="missionsTitle">دليل المهام</h2>
          <button class="close-btn" id="btn-missions-close">✕</button>
        </div>
        <div class="missions-tabs">
          <button class="tab-btn active" data-tab="all" data-i18n="tab_all">الكل</button>
          <button class="tab-btn" data-tab="story" data-i18n="tab_story">القصة</button>
          <button class="tab-btn" data-tab="racing" data-i18n="tab_racing">سباقات</button>
          <button class="tab-btn" data-tab="delivery" data-i18n="tab_delivery">توصيل</button>
          <button class="tab-btn" data-tab="combat" data-i18n="tab_combat">قتال</button>
          <button class="tab-btn" data-tab="heist" data-i18n="tab_heist">سرقات</button>
          <button class="tab-btn" data-tab="collect" data-i18n="tab_collect">جمع</button>
        </div>
        <div class="missions-list" id="missions-list"></div>
        <div class="mission-detail" id="mission-detail">
          <div id="md-title">—</div>
          <div id="md-desc">—</div>
          <div id="md-reward">—</div>
          <div id="md-status">—</div>
          <button class="menu-btn primary hidden" id="btn-start-mission">بدء المهمة</button>
        </div>
      </div>
    </div>

    <div id="settings-menu" class="hidden" dir="rtl">
      <div class="submenu-panel">
        <div class="submenu-header">
          <h2>الإعدادات</h2>
          <button class="close-btn" id="btn-settings-close">✕</button>
        </div>
        <div class="settings-grid">
          <div class="setting-row">
            <label data-i18n="lbl_master">مستوى الصوت</label>
            <input type="range" id="set-master" min="0" max="100" value="80">
          </div>
          <div class="setting-row">
            <label data-i18n="lbl_sens">حساسية الماوس</label>
            <input type="range" id="set-sens" min="1" max="20" value="6">
          </div>
          <div class="setting-row">
            <label data-i18n="lbl_fov">مجال الرؤية</label>
            <input type="range" id="set-fov" min="55" max="110" value="75">
          </div>
          <div class="setting-row">
            <label data-i18n="lbl_quality">جودة الرسوم</label>
            <select id="set-quality">
              <option value="low" data-i18n="qualityLow">منخفضة</option>
              <option value="medium" selected data-i18n="qualityMedium">متوسطة</option>
              <option value="high" data-i18n="qualityHigh">عالية</option>
            </select>
          </div>
          <div class="setting-row">
            <label data-i18n="lbl_daycycle">دورة ليل/نهار</label>
            <input type="checkbox" id="set-daycycle" checked>
          </div>
          <div class="setting-row">
            <label data-i18n="lbl_vehicles">حركة السيارات والمارة</label>
            <input type="checkbox" id="set-traffic" checked>
          </div>
          <div class="setting-row">
            <label data-i18n="lbl_lang">اللغة</label>
            <select id="set-lang">
              <option value="ar">العربية</option>
              <option value="en">English</option>
            </select>
          </div>
        </div>
        <button class="menu-btn primary" id="btn-settings-save" data-i18n="settings_save">حفظ</button>
      </div>
    </div>

    <div id="controls-menu" class="hidden" dir="rtl">
      <div class="submenu-panel">
        <div class="submenu-header">
          <h2 data-i18n="controls">التعليمات والتحكم</h2>
          <button class="close-btn" id="btn-controls-close">✕</button>
        </div>
        <div id="controls-content" class="controls-content"></div>
      </div>
    </div>

    <div id="mission-complete-modal" class="hidden">
      <div class="complete-panel">
        <div class="complete-title" id="complete-title">المهمة مكتملة!</div>
        <div class="complete-reward" id="complete-reward">+ $0</div>
        <div class="complete-stats" id="complete-stats"></div>
        <button class="menu-btn primary" id="btn-complete-continue">متابعة</button>
      </div>
    </div>

    <div id="gameover-modal" class="hidden">
      <div class="complete-panel gameover">
        <div class="complete-title">قتلتَ في المهمة</div>
        <div class="complete-reward">عُد إلى نقطة الأمان</div>
        <button class="menu-btn primary" id="btn-gameover-continue">إعادة المحاولة</button>
      </div>
    </div>
  </div>

  <!-- Vendor -->
  <script src="js/vendor/three.min.js"></script>
  <!-- Core -->
  <script src="js/core/config.js"></script>
  <script src="js/core/i18n.js"></script>
  <script src="js/core/input.js"></script>
  <script src="js/core/touch.js"></script>
  <script src="js/core/audio.js"></script>
  <script src="js/core/save.js"></script>
  <!-- World -->
  <script src="js/world/city.js"></script>
  <script src="js/world/vehicle.js"></script>
  <script src="js/world/effects.js"></script>
  <!-- Advanced AI -->
  <script src="js/systems/coversystem.js"></script>
  <!-- Entities -->
  <script src="js/entities/player.js"></script>
  <script src="js/entities/npc.js"></script>
  <script src="js/entities/pickup.js"></script>
  <!-- Combat -->
  <script src="js/combat/weapons.js"></script>
  <!-- Missions -->
  <script src="js/missions/data/story.js"></script>
  <script src="js/missions/data/racing.js"></script>
  <script src="js/missions/data/delivery.js"></script>
  <script src="js/missions/data/combat.js"></script>
  <script src="js/missions/data/heist.js"></script>
  <script src="js/missions/data/collect.js"></script>
  <script src="js/missions/missionmanager.js"></script>
  <!-- World -->
  <script src="js/world/interiors.js"></script>
  <!-- UI -->
  <script src="js/ui/hud.js"></script>
  <script src="js/ui/minimap.js"></script>
  <script src="js/ui/menus.js"></script>
  <!-- Entry -->
  <script src="js/main.js"></script>
</body>
</html>
